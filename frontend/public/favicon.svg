<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="50%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#051f21"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#31C97A"/>
      <stop offset="100%" stop-color="#54E399"/>
    </linearGradient>
    <radialGradient id="lensGlow" cx="32" cy="32" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#54E399" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#00e5ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Shield -->
  <path d="M32 4 L54 13 V31 C54 44.5 44.5 55.5 32 60 C19.5 55.5 10 44.5 10 31 V13 Z"
        fill="url(#shieldGrad)" stroke="url(#borderGrad)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Inner Hex Ring -->
  <polygon points="32,18 43,24.5 43,37.5 32,44 21,37.5 21,24.5"
           stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.5" fill="none"/>

  <!-- Glowing Radar Core -->
  <circle cx="32" cy="31" r="11" fill="url(#lensGlow)"/>
  <circle cx="32" cy="31" r="8" stroke="#54E399" stroke-width="1.6" fill="none" filter="url(#neon)"/>
  <circle cx="32" cy="31" r="3.2" fill="#FFFFFF"/>

  <!-- Crosshair Reticles -->
  <line x1="32" y1="19" x2="32" y2="23" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="39" x2="32" y2="43" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="31" x2="24" y2="31" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="31" x2="44" y2="31" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cyber Node Sparkle -->
  <circle cx="43" cy="24.5" r="1.5" fill="#54E399"/>
  <circle cx="21" cy="24.5" r="1.5" fill="#00e5ff"/>
  <circle cx="32" cy="44" r="1.5" fill="#31C97A"/>
</svg>
